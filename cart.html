<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cart — Misk</title>
<link rel="icon" type="image/png" href="log.png">

<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600&family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--navy:#2B4664;--silver:#BCC1C5;--greige:#E8E1D8;--ink:#5f6b78}
*{box-sizing:border-box;margin:0;padding:0}
html,body{overflow-x:hidden;width:100%}
body{font-family:'Poppins',sans-serif;color:#1f2d3d;background:#fdfcfa;line-height:1.6;font-size:15px}
h1,h2,h3{font-family:'Cormorant Garamond',serif;font-weight:600;line-height:1.15;color:var(--navy)}
a{text-decoration:none;color:inherit}
img{display:block;max-width:100%}
button{font-family:inherit}

.announce{background:var(--navy);color:var(--greige);height:36px;overflow:hidden;display:flex;align-items:center}
.announce-track{display:flex;gap:3.5rem;width:max-content;white-space:nowrap;font-size:.8rem;letter-spacing:.4px;animation:scroll 26s linear infinite}
.announce-track span{white-space:nowrap}
@keyframes scroll{from{transform:translateX(0)}to{transform:translateX(-50%)}}

.nav{position:sticky;top:0;z-index:80;height:64px;display:grid;grid-template-columns:1fr auto 1fr;
  align-items:center;padding:0 1.2rem;background:#fff;border-bottom:1px solid var(--greige)}
.nav-l{display:flex;gap:1.4rem;align-items:center}
.nav a.link{font-size:.92rem;font-weight:500}
.logo img{height:40px}
.nav-r{display:flex;justify-content:flex-end;gap:1rem;align-items:center}
.cart-btn{position:relative;color:var(--navy);padding:.3rem}
.cart-btn svg{width:22px;height:22px}
.badge{position:absolute;top:-2px;right:-6px;background:var(--navy);color:#fff;font-size:.62rem;
  min-width:16px;height:16px;border-radius:50%;display:grid;place-items:center}

.crumb{max-width:1200px;margin:1.4rem auto 0;padding:0 1.4rem;font-size:.82rem;color:#7a8694}
.crumb a{color:var(--navy);opacity:.85;font-weight:500}
.crumb a:hover{opacity:1;text-decoration:underline}

.cart-page{max-width:1200px;margin:1.4rem auto 3rem;padding:0 1.4rem}
.page-title{font-size:clamp(2rem,4.5vw,2.9rem);margin-bottom:.3rem;letter-spacing:-.3px}
.page-sub{font-size:.95rem;color:#7a8694;margin-bottom:1.8rem}

.cart-layout{display:grid;grid-template-columns:1fr 380px;gap:2rem;align-items:start}

.cart-list{display:flex;flex-direction:column;gap:1rem}
.cart-item{background:#fff;border:1px solid var(--greige);border-radius:18px;padding:1rem;
  display:grid;grid-template-columns:110px 1fr auto;gap:1.2rem;align-items:center;
  box-shadow:0 4px 16px rgba(43,70,100,.04);
  animation:fadeUp .5s cubic-bezier(.2,.7,.3,1) both}
.cart-item.unavailable{opacity:.7;border-style:dashed;border-color:#c0392b}
.ci-media{background:var(--greige);border-radius:12px;overflow:hidden;aspect-ratio:4/5;width:110px;position:relative}
.ci-media img{width:100%;height:100%;object-fit:cover}
.ci-media.missing{display:flex;align-items:center;justify-content:center;font-size:2rem;color:#8a95a1;background:#f5f0e8}
.ci-brand{font-size:.72rem;letter-spacing:1.3px;text-transform:uppercase;color:#8a95a1;
  margin-bottom:.3rem;font-weight:600}
.ci-body h3{font-size:1.15rem;margin-bottom:.4rem;color:var(--navy);line-height:1.25}
.ci-size{font-size:.82rem;color:#6b7783;margin-bottom:.6rem}
.ci-size strong{color:var(--navy);font-weight:600}
.ci-price{font-size:1rem;font-weight:700;color:var(--navy)}
.ci-price.na{color:#c0392b;font-size:.85rem;font-weight:600}
.ci-actions{display:flex;flex-direction:column;gap:.65rem;align-items:flex-end}
.qty-wrap{display:inline-flex;align-items:center;border:1px solid var(--greige);border-radius:10px;overflow:hidden;background:#fff}
.qty-btn{width:36px;height:36px;border:0;background:#fff;color:var(--navy);font-size:1.05rem;cursor:pointer;font-weight:600}
.qty-btn:hover{background:var(--greige)}
.qty-val{min-width:36px;text-align:center;font-size:.9rem;font-weight:600}
.ci-remove{background:none;border:0;color:#a04a54;font:inherit;font-size:.78rem;
  letter-spacing:.4px;cursor:pointer;text-decoration:underline;text-underline-offset:3px;font-weight:500}
.ci-remove:hover{color:#7a3540}

.summary{background:#fff;border:1px solid var(--greige);border-radius:18px;padding:1.5rem;
  position:sticky;top:84px;box-shadow:0 8px 24px rgba(43,70,100,.06);
  animation:fadeUp .5s .15s cubic-bezier(.2,.7,.3,1) both}
.summary h2{font-size:1.4rem;margin-bottom:1rem}
.sum-row{display:flex;justify-content:space-between;font-size:.92rem;color:var(--ink);padding:.6rem 0}
.sum-row strong{color:var(--navy);font-weight:600}
.sum-row.big{font-size:1.1rem;border-top:1px solid var(--greige);padding-top:1rem;margin-top:.6rem;
  font-family:'Cormorant Garamond',serif}
.sum-row.big strong{font-size:1.35rem;font-weight:700}
.sum-note{background:#fdf6f0;border:1px dashed #e8d5c0;border-radius:10px;padding:.9rem 1rem;
  font-size:.82rem;color:#8a5a3a;margin:1rem 0;line-height:1.6}
.sum-note strong{color:var(--navy);font-weight:600}
.sum-note.warn{background:#fef3c7;border-color:#fbbf24;color:#78350f}
.btn-checkout{display:block;width:100%;background:var(--navy);color:#fff;border:0;
  padding:1.05rem;border-radius:12px;font:inherit;font-size:.92rem;font-weight:700;
  letter-spacing:1px;text-transform:uppercase;cursor:pointer;text-align:center;
  margin-top:1rem;transition:transform .25s, box-shadow .25s, background .25s}
.btn-checkout:hover{background:#1f3450;transform:translateY(-2px);box-shadow:0 14px 30px rgba(43,70,100,.3)}
.btn-checkout.disabled{background:#c2c7cc;cursor:not-allowed;transform:none;box-shadow:none}
.btn-continue{display:block;text-align:center;margin-top:.9rem;font-size:.85rem;
  color:var(--navy);text-decoration:underline;text-underline-offset:3px;font-weight:500}

.empty-cart{text-align:center;padding:4rem 1rem}
.empty-cart .icon{font-size:3.8rem;margin-bottom:.7rem}
.empty-cart h2{font-size:1.7rem;margin-bottom:.6rem}
.empty-cart p{color:var(--ink);margin-bottom:1.6rem;font-weight:400;font-size:.95rem}
.btn-shop{display:inline-block;background:var(--navy);color:#fff;padding:1rem 2.2rem;
  border-radius:12px;font-size:.9rem;font-weight:600;letter-spacing:.8px;text-transform:uppercase}
.btn-shop:hover{background:#1f3450}

@keyframes fadeUp{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:none}}

@media(max-width:900px){
  .cart-layout{grid-template-columns:1fr}
  .summary{position:static}
  .cart-item{grid-template-columns:80px 1fr;gap:1rem}
  .ci-media{width:80px}
  .ci-actions{grid-column:1/-1;flex-direction:row;justify-content:space-between;align-items:center}
  .page-title{font-size:1.9rem}
}
/* ============================================================
   CIRCULAR ANIMATED LOGO — Navbar (all pages)
   ============================================================ */
.nav .logo{
  position: relative;
  display: grid !important;
  place-items: center;
  width: 52px !important;
  height: 52px !important;
  border-radius: 50%;
  background: #fff;
  box-shadow: 0 0 0 2px var(--navy), 0 6px 18px rgba(43,70,100,.18);
  overflow: visible !important;
  transition: transform .35s;
  animation: navLogoPulse 4s ease-in-out infinite;
}

.nav .logo img{
  width: 100% !important;
  height: 100% !important;
  object-fit: cover !important;
  border-radius: 50%;
  display: block;
  position: relative;
  z-index: 1;
}

/* Spinning silver ring around the circle */
.nav .logo::after{
  content: "";
  position: absolute;
  inset: -4px;
  border-radius: 50%;
  border: 2px solid transparent;
  border-top-color: var(--silver);
  border-right-color: rgba(188,193,197,.5);
  animation: logoSpin 8s linear infinite;
  pointer-events: none;
}

@keyframes logoSpin{
  to { transform: rotate(360deg); }
}

/* Gentle pulse */
@keyframes navLogoPulse{
  0%, 100% {
    transform: scale(1);
    box-shadow: 0 0 0 2px var(--navy), 0 6px 18px rgba(43,70,100,.18);
  }
  50% {
    transform: scale(1.05);
    box-shadow: 0 0 0 3px var(--silver), 0 10px 24px rgba(43,70,100,.28);
  }
}

/* Hover — stop pulse, scale + tilt */
.nav .logo:hover{
  animation: none;
  transform: scale(1.1) rotate(6deg);
}

/* Smaller circle on mobile */
@media (max-width: 900px){
  .nav .logo{
    width: 46px !important;
    height: 46px !important;
  }
}
</style>
</head>
<body>

<div class="announce">
  <div class="announce-track">
    <span>👑 Premium Dresses — Elegance Redefined</span>
    <span>🌿 Casual &amp; Daily Wears — Comfort Meets Style</span>
    <span>✨ New Collection Live Now — Shop Today</span>
    <span>👑 Premium Dresses — Elegance Redefined</span>
    <span>🌿 Casual &amp; Daily Wears — Comfort Meets Style</span>
    <span>✨ New Collection Live Now — Shop Today</span>
  </div>
</div>

<nav class="nav">
  <div class="nav-l">
    <a href="index.html" class="link">Home</a>

  </div>
  <a href="index.html" class="logo"><img src="log.png" alt="Misk"></a>
  <div class="nav-r">
    <a href="cart.html" class="cart-btn">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M6 8h12l-1 12H7L6 8z"/><path d="M9 8V6a3 3 0 0 1 6 0v2"/></svg>
      <span class="badge" id="cartCount">0</span>
    </a>
  </div>
</nav>

<p class="crumb"><a href="index.html">Home</a> / <span>Cart</span></p>

<main class="cart-page">
  <h1 class="page-title">Your Cart 🛍️</h1>
  <p class="page-sub" id="pageSub">Loading…</p>
  <div id="cartContent"></div>
</main>

<script>
/* ============================================================
   SELF-CONTAINED PRODUCT CATALOG
   — Cart always has every product, independent of products.js
   ============================================================ */
const CART_PRODUCTS = [
  /* New Arrivals */
  { id:'festive-ruby',          brand:'Scarlet Ruby', name:'Festive Ruby 3pc',              price:7800,  img:'new arrivals/scarlet/R1.PNG' },
  { id:'emerald-mandarin',      brand:'Aura',         name:'Emerald Mandarin Collar 2pc',   price:4500,  img:'new arrivals/aura/1.png' },
  { id:'emerald-floral',        brand:'Mirana',       name:'Emerald Floral Embroidered 2pc',price:7200,  img:'new arrivals/mirana/1.png' },
  { id:'farshi-white',          brand:'Naaz',         name:'Farshi Shalwar — White',        price:4800,  img:'new arrivals/naaz/n2.PNG' },
  { id:'midnight-black',        brand:'Zar-e-Siyaah', name:'Midnight Black 3pc',            price:7500,  img:'new arrivals/zar/Z11.JPEG' },
  /* Best Sellers */
  { id:'khaki-printed',         brand:'Khaki',        name:'Printed Lawn 2pc',              price:6200,  img:'best/khaki/K1.PNG' },
  { id:'noor-maroon',           brand:'Noor',         name:'Maroon Cutwork Shirt 2pc',      price:14500, img:'best/noor/N11.jpeg' },
  { id:'boxy-white',            brand:'Boxy',         name:'Long Embroidered Shirt — White',price:7500,  img:'best/boxy/w4.jpeg' },
  { id:'boxy-green',            brand:'Boxy',         name:'Long Embroidered Shirt — Green',price:7500,  img:'best/boxy/g2.jpeg' },
  /* Basics */
  { id:'tea-pink-embroidered',  brand:'Riaa',         name:'Tea Pink Embroidered 2pc',      price:4650,  img:'basic/riaa/RI1.jpeg' },
  { id:'black-embroidered',     brand:'Naya',         name:'Black Embroidered 2pc',         price:3800,  img:'basic/naya/N1.PNG' },

  /* Solids */
{ id:'amethyst-boat-cowl',    brand:'Amethyst', name:'Royal Blue Boat Cowl 2pc',      price:3200, img:'solid/ame/am1.PNG' },
{ id:'sage-v-pleat',          brand:'Sage',     name:'Green V-Pleat Long Shirt 2pc',  price:3200, img:'solid/sage/s1.PNG' },
{ id:'solenne-stone',         brand:'Solenne',  name:'Soft Hue Stone Work 2pc',       price:4500, img:'solid/sole/S11.PNG' },
{ id:'ruby-fringe',           brand:'Ruby',     name:'Fringes & Buttons 2pc',         price:3500, img:'solid/ruby/r1.PNG' },
{ id:'flare-button',          brand:'Flare',    name:'Straight-Cut Button-Down 2pc',  price:3800, img:'solid/flair/f1.PNG' },
  { id:'airra-purple-kurta', brand:'Airra', name:'Royal Purple Floral Kurta 2pc', price:4500, img:'embro/airra/A11.jpeg' } ,

  { id:'twilight-sage-vine', brand:'Twilight Bloom', name:'Sage Floral Vine 3pc', price:16500, img:'formal/twi/T11.jpeg' }
  
];

/* ============================================================
   SAFE CART HELPERS — never delete items
   ============================================================ */
function safeGetCart() {
  try { return JSON.parse(localStorage.getItem('cart') || '[]'); }
  catch (e) { return []; }
}
function safeSaveCart(c) {
  localStorage.setItem('cart', JSON.stringify(c));
  updateBadge();
}
function safeFindProduct(id) {
  return CART_PRODUCTS.find(p => p.id === id);
}
function updateBadge() {
  const n = safeGetCart().reduce((s,i) => s + (i.qty || 0), 0);
  document.querySelectorAll('#cartCount, .cart-badge').forEach(el => el.textContent = n);
}

/* ============================================================
   RENDER CART
   ============================================================ */
function renderCart() {
  const cart = safeGetCart();
  const content = document.getElementById('cartContent');
  const sub = document.getElementById('pageSub');

  if (!cart.length) {
    sub.textContent = '';
    content.innerHTML = `
      <div class="empty-cart">
        <div class="icon">🛒</div>
        <h2>Your cart is empty</h2>
        <p>Discover elegant pieces crafted for every occasion.</p>
        <a href="new-arrivals.html" class="btn-shop">Shop New Arrivals →</a>
      </div>`;
    updateBadge();
    return;
  }

  let hasUnavailable = false;
  let subtotal = 0;

  const itemsHTML = cart.map((item, i) => {
    const p = safeFindProduct(item.id);
    if (!p) {
      hasUnavailable = true;
      return `
        <div class="cart-item unavailable" style="animation-delay:${i*0.06}s">
          <div class="ci-media missing">📦</div>
          <div class="ci-body">
            <p class="ci-brand">Unavailable</p>
            <h3>Product no longer available</h3>
            <p class="ci-size">ID: <strong>${item.id}</strong> · Size <strong>${item.size}</strong></p>
            <p class="ci-price na">This item has been removed or is no longer sold</p>
          </div>
          <div class="ci-actions">
            <button class="ci-remove" data-action="remove" data-key="${item.key}">Remove</button>
          </div>
        </div>`;
    }

    subtotal += p.price * item.qty;

    return `
      <div class="cart-item" style="animation-delay:${i*0.06}s">
        <div class="ci-media"><img src="${p.img}" alt="${p.name}" onerror="this.style.opacity=.3"></div>
        <div class="ci-body">
          <p class="ci-brand">${p.brand}</p>
          <h3>${p.name}</h3>
          <p class="ci-size">Size: <strong>${item.size}</strong></p>
          <p class="ci-price">Rs. ${(p.price * item.qty).toLocaleString()}</p>
        </div>
        <div class="ci-actions">
          <div class="qty-wrap">
            <button class="qty-btn" data-action="minus" data-key="${item.key}">−</button>
            <span class="qty-val">${item.qty}</span>
            <button class="qty-btn" data-action="plus" data-key="${item.key}">+</button>
          </div>
          <button class="ci-remove" data-action="remove" data-key="${item.key}">Remove</button>
        </div>
      </div>`;
  }).join('');

  const delivery = subtotal >= 10000 ? 0 : 350;
  const total = subtotal + delivery;

  sub.textContent = `${cart.length} item${cart.length!==1?'s':''} in your cart`;

  content.innerHTML = `
    <div class="cart-layout">
      <div class="cart-list">${itemsHTML}</div>
      <aside class="summary">
        <h2>Order Summary</h2>
        <div class="sum-row"><span>Subtotal</span><strong>Rs. ${subtotal.toLocaleString()}</strong></div>
        <div class="sum-row"><span>Delivery</span><strong>${delivery === 0 ? 'FREE 🎁' : 'Rs. ' + delivery}</strong></div>
        <div class="sum-row big"><span>Total</span><strong>Rs. ${total.toLocaleString()}</strong></div>
        <div class="sum-note">
          💳 <strong>Get 5% off</strong> if you pay in advance (HBL / EasyPaisa).<br>
          🎁 Free delivery on orders above Rs. 10,000.
        </div>
        ${hasUnavailable ? '<div class="sum-note warn">⚠️ Some items are unavailable. Please remove them before checkout.</div>' : ''}
        <a href="checkout.html" class="btn-checkout ${hasUnavailable || subtotal === 0 ? 'disabled' : ''}">${hasUnavailable ? 'Remove unavailable items first' : 'Proceed to Checkout →'}</a>
        <a href="new-arrivals.html" class="btn-continue">or continue shopping</a>
      </aside>
    </div>`;

  if (hasUnavailable) {
    const btn = document.querySelector('.btn-checkout');
    btn.removeAttribute('href');
    btn.addEventListener('click', e => e.preventDefault());
  }

  updateBadge();
}

/* ============================================================
   Cart item actions
   ============================================================ */
document.getElementById('cartContent').addEventListener('click', e => {
  const btn = e.target.closest('[data-action]');
  if (!btn) return;
  const key = btn.dataset.key;
  const action = btn.dataset.action;
  const cart = safeGetCart();
  const item = cart.find(i => i.key === key);
  if (!item) return;

  if (action === 'plus') item.qty++;
  if (action === 'minus') { item.qty--; if (item.qty <= 0) cart.splice(cart.indexOf(item), 1); }
  if (action === 'remove') cart.splice(cart.indexOf(item), 1);

  safeSaveCart(cart);
  renderCart();
});

/* ---------- Run ---------- */
try {
  renderCart();
} catch (err) {
  console.error('❌ Cart render failed:', err);
  document.getElementById('pageSub').textContent = '';
  document.getElementById('cartContent').innerHTML = `
    <div style="text-align:center;padding:3rem 1rem;color:#c0392b">
      <p style="font-size:2rem;margin-bottom:.5rem">⚠️</p>
      <p style="font-weight:600;margin-bottom:.5rem">Something went wrong loading the cart.</p>
      <p style="font-size:.85rem;color:#7a8694;margin-bottom:1rem">Open the browser console (F12) for details.</p>
      <a href="new-arrivals.html" style="color:var(--navy);text-decoration:underline;font-weight:600">← Back to shop</a>
    </div>`;
}
</script>
</body>
</html>
