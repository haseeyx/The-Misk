<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Misk — Collection</title>
<link rel="icon" type="image/png" href="log.png">

<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@600&family=Poppins:wght@300;400&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<nav class="nav">
  <a href="index.html" class="nav-link">← Back</a>
  <a href="index.html" class="logo"><img src="log.png" alt="Misk"></a>
  <div class="nav-right">
    <a href="cart.html" class="icon-btn" aria-label="Cart">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M6 8h12l-1 12H7L6 8z"/><path d="M9 8V6a3 3 0 0 1 6 0v2"/></svg>
      <span class="badge" id="cartCount">0</span>
    </a>
  </div>
</nav>

<section class="section">
  <h2 id="title">Collection</h2>
  <p class="lead" id="sub"></p>
  <div class="cards" id="grid"></div>
</section>

<script>
const names = {
  'new-arrivals' : 'New Arrivals ',
  'best-sellers' : 'Best Sellers ',
  'solids'       : 'Solids ',
  'basics'       : 'Basics ',
  'embroidered'  : 'Embroidered ',
  'formals'      : 'Formals '
};
const key = new URLSearchParams(location.search).get('c') || 'new-arrivals';
document.getElementById('title').textContent = names[key] || 'Collection';
document.getElementById('sub').textContent = 'Handpicked pieces from the Misk wardrobe.';
document.getElementById('grid').innerHTML = Array.from({length:8},(_,i)=>`
  <div class="card">
    <div class="card-img">👗</div>
    <h3>${names[key]} ${i+1}</h3>
    <p>Rs. ${(2490 + i*500).toLocaleString()}</p>
  </div>`).join('');

const cart = JSON.parse(localStorage.getItem('cart') || '[]');
document.getElementById('cartCount').textContent = cart.reduce((s,i)=>s+i.qty,0);
</script>
</body>
</html>
